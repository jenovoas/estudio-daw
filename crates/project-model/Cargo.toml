[package]
name = "estudio-daw-project-model"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Modelo canónico de proyecto y adaptador de intercambio DAWproject para Estudio DAW"

[dependencies]
estudio-daw-midi-types = { path = "../midi-types" }
quick-xml = { version = "0.37", features = ["serialize"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
zip = "2"

[dev-dependencies]
pretty_assertions = "1"

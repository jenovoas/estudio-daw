[package]
name = "estudio-daw-project-model"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Canonical project model and DAWproject interchange adapter for Estudio DAW"

[dependencies]
estudio-daw-audio-engine = { path = "../audio-engine" }
estudio-daw-audio-platform = { path = "../audio-platform" }
estudio-daw-midi-engine = { path = "../midi-engine" }
estudio-daw-session = { path = "../session" }
estudio-daw-runtime-diagnostics = { path = "../runtime-diagnostics" }
quick-xml = { version = "0.37", features = ["serialize"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
zip = "2"

[dev-dependencies]
pretty_assertions = "1"

[package]
name = "estudio-daw-command-bus"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Bus versionado de comandos de dominio para Estudio DAW"

[dependencies]
estudio-daw-project-model = { path = "../project-model" }
estudio-daw-midi-types = { path = "../midi-types" }
estudio-daw-session = { path = "../session" }
serde = { version = "1", features = ["derive"] }
thiserror = "2"

[dev-dependencies]
serde_json = "1"

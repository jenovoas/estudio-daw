[package]
name = "estudio-daw-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Command-line adapter for Estudio DAW"

[[bin]]
name = "estudio-daw-project"
path = "src/bin/estudio-daw-project.rs"

[dependencies]
estudio-daw-audio-engine = { path = "../audio-engine" }
estudio-daw-audio-platform = { path = "../audio-platform" }
estudio-daw-command-bus = { path = "../command-bus" }
estudio-daw-midi-engine = { path = "../midi-engine" }
estudio-daw-project-model = { path = "../project-model" }
estudio-daw-runtime-diagnostics = { path = "../runtime-diagnostics" }
estudio-daw-session = { path = "../session" }
serde_json = "1"

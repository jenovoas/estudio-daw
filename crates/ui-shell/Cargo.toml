[package]
name = "estudio-daw-ui-shell"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Ventana de escritorio Tauri para Estudio DAW"
build = "build.rs"

[[bin]]
name = "estudio-daw"
path = "src/main.rs"

[build-dependencies]
tauri-build = "2"

[dependencies]
base64 = "0.22"
crossbeam-queue = "0.3"
estudio-daw-application = { path = "../application" }
estudio-daw-audio-engine = { path = "../audio-engine" }
estudio-daw-audio-platform = { path = "../audio-platform" }
estudio-daw-midi-engine = { path = "../midi-engine" }
estudio-daw-media-adapter = { path = "../media-adapter" }
estudio-daw-project-model = { path = "../project-model" }
estudio-daw-runtime-diagnostics = { path = "../runtime-diagnostics" }
estudio-daw-synth = { path = "../synth" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tauri = "2"
tauri-plugin-dialog = "2"
vst3-host = { version = "0.9", default-features = false, features = ["process-isolation"] }
